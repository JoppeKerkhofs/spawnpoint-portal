[package]
name = "portal-core"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "portal"
path = "src/main.rs"

[dependencies]
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "sync", "process", "time", "io-util"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net"] }
