name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches the app's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the app's version $version (package.json)." >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace
      - run: npx vue-tsc --noEmit
      - run: npm test

      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: target/release/bundle/nsis/*-setup.exe*
          retention-days: 30

      - name: Upload the release to the panel
        env:
          PANEL_RELEASE_TOKEN: ${{ secrets.PANEL_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          files=(target/release/bundle/nsis/*-setup.exe)
          [ "${#files[@]}" -eq 1 ] || { echo "Expected one installer, found ${#files[@]}." >&2; exit 1; }
          installer="${files[0]}"
          signature=$(tr -d '\r\n' < "$installer.sig")
          sha256=$(sha256sum "$installer" | cut -d ' ' -f 1)
          code=$(curl --fail-with-body --silent --show-error --request PUT \
            --header "Authorization: Bearer $PANEL_RELEASE_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/octet-stream" \
            --header "X-Signature: $signature" \
            --header "X-Sha256: $sha256" \
            --data-binary "@$installer" \
            --output response.txt --write-out '%{http_code}' \
            "https://spawnpoint.joppek.be/api/v1/portal/releases/${TAG#v}") || { cat response.txt; exit 1; }
          [ "$code" = 201 ] || { echo "The panel answered $code." >&2; cat response.txt; exit 1; }
